name: Deploy to Timeweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build

      - name: Fix image paths for Timeweb (replace /-/images/ with /images/)
        run: |
          echo "Fixing /-/ paths in HTML files..."
          find out/ -name "*.html" | xargs sed -i \
            's|src="/-/|src="/|g;
             s|href="/-/|href="/|g;
             s|srcset="/-/|srcset="/|g;
             s|content="/-/|content="/|g;
             s|url(/-/|url(/|g'
          echo "Fixing /-/ paths in JS files..."
          find out/ -name "*.js" | xargs sed -i \
            's|"/-/images/|"/images/|g;
             s|'\''/-/images/|'\''/images/|g;
             s|`/-/images/|`/images/|g'
          echo "Fixing /-/ paths in CSS files..."
          find out/ -name "*.css" | xargs sed -i \
            's|/-/images/|/images/|g'
          echo "Done fixing paths."

      - name: Deploy to Timeweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
