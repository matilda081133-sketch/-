name: Deploy to Timeweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build

      - name: Fix /-/ navigation paths in HTML (links, hrefs, breadcrumbs)
        run: |
          echo "=== Fixing navigation paths in HTML ==="
          find out/ -name "*.html" | xargs sed -i \
            -e 's|href="/-/|href="/|g' \
            -e 's|src="/-/|src="/|g' \
            -e 's|srcset="/-/|srcset="/|g' \
            -e 's|content="/-/|content="/|g' \
            -e 's|url(/-/|url(/|g'
          echo "HTML done."

      - name: Fix /-/ navigation paths in JS bundles (Next.js router)
        run: |
          echo "=== Fixing JS router bundles ==="
          find out/_next/ -name "*.js" -print0 | xargs -0 sed -i \
            -e 's|"/-/|"/|g' \
            -e "s|'/-/|'/|g"
          echo "JS done."

      - name: Deploy to Timeweb via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
