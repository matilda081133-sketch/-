name: Deploy to Timeweb

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-timeweb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build

      - name: Fix /-/ navigation paths in HTML (links, hrefs, breadcrumbs)
        run: |
          echo "=== Fixing navigation paths in HTML ==="
          find out/ -name "*.html" | xargs sed -i \
            -e 's|href="/-/|href="/|g' \
            -e 's|src="/-/|src="/|g' \
            -e 's|srcset="/-/|srcset="/|g' \
            -e 's|content="/-/|content="/|g' \
            -e 's|url(/-/|url(/|g'
          echo "HTML done."

      - name: Fix /-/ navigation paths in JS bundles (Next.js router)
        run: |
          echo "=== Fixing JS router bundles ==="
          find out/_next/ -name "*.js" -print0 | xargs -0 sed -i \
            -e 's|"/-/|"/|g' \
            -e "s|'/-/|'/|g"
          echo "JS done."

      - name: Prepare atomic deployment package
        run: |
          echo "=== Packaging out/ into deploy_pkg/deploy.zip ==="
          mkdir -p deploy_pkg
          cd out
          zip -r -q ../deploy_pkg/deploy.zip .
          cd ..
          ls -lh deploy_pkg/deploy.zip

          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "DEPLOY_TOKEN=$DEPLOY_TOKEN" >> "$GITHUB_ENV"
          cp scripts/deploy_extract.template.php deploy_pkg/deploy_extract.php
          sed -i "s/__DEPLOY_TOKEN__/$DEPLOY_TOKEN/g" deploy_pkg/deploy_extract.php
          echo "Atomic package prepared with 2 files."

      - name: Upload atomic package via FTP
        id: upload_pkg
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy_pkg/
          server-dir: /public_html/
          dangerous-clean-slate: false

      - name: Trigger atomic extraction on Timeweb
        id: trigger_extract
        if: steps.upload_pkg.outcome == 'success'
        continue-on-error: true
        run: |
          echo "=== Triggering atomic extraction via HTTPS ==="
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 60 "https://dejure-help.ru/deploy_extract.php?token=${DEPLOY_TOKEN}")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | head -n-1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -eq 200 ] && echo "$BODY" | grep -q '"success":true'; then
            echo "=== Zero-Downtime extraction completed successfully in < 1s! ==="
          else
            echo "Atomic extraction returned unexpected response."
            exit 1
          fi

      - name: Fallback to full FTP sync (if atomic deploy fails)
        if: steps.upload_pkg.outcome != 'success' || steps.trigger_extract.outcome != 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
