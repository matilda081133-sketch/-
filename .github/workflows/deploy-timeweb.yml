name: Deploy to Timeweb

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-timeweb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build

      - name: Fix /-/ navigation paths in HTML (links, hrefs, breadcrumbs)
        run: |
          echo "=== Fixing navigation paths in HTML ==="
          find out/ -name "*.html" | xargs sed -i \
            -e 's|href="/-/|href="/|g' \
            -e 's|src="/-/|src="/|g' \
            -e 's|srcset="/-/|srcset="/|g' \
            -e 's|content="/-/|content="/|g' \
            -e 's|url(/-/|url(/|g'
          echo "HTML done."

      - name: Fix /-/ navigation paths in JS bundles (Next.js router)
        run: |
          echo "=== Fixing JS router bundles ==="
          find out/_next/ -name "*.js" -print0 | xargs -0 sed -i \
            -e 's|"/-/|"/|g' \
            -e "s|'/-/|'/|g"
          echo "JS done."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to Timeweb via FTP
        timeout-minutes: 8
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "
            set net:timeout 10;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set ftp:ssl-allow no;
            set mirror:parallel-transfer-count 5;
            set mirror:use-pget-n 5;
            open -u \$FTP_USERNAME,\$FTP_PASSWORD \$FTP_HOST;
            mirror --reverse --delete --verbose --exclude .git/ --exclude node_modules/ out/ /public_html/;
            bye
          "
          echo "FTP deploy done."
